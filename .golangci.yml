version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - unconvert
    - unparam
    - revive
    - bodyclose
    - nilerr
    - nolintlint
    - copyloopvar

  settings:
    errcheck:
      exclude-functions:
        # Idiomatic deferred cleanup / best-effort calls.
        - (io.Closer).Close
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - (net/http.ResponseWriter).Write
        - os.Remove
        - os.RemoveAll
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (github.com/jackc/pgx/v5.BatchResults).Close
        - (github.com/shurco/gosign/pkg/storage/redis.Handler).Close
    revive:
      rules:
        - name: var-naming
        - name: exported
          disabled: true
        - name: indent-error-flow
        - name: range-val-in-closure
        - name: time-naming
        - name: unexported-return
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
    staticcheck:
      checks:
        - all
        - '-ST1000' # package comments: not enforced
        - '-ST1003' # underscores in names (ok for test fixtures)
        - '-ST1005' # upper-case error messages (legacy spots)
        - '-QF*' # quickfix style suggestions: advisory only

  exclusions:
    paths:
      - web/ # node_modules may contain third-party Go files
    rules:
      - path: _test\.go
        linters:
          - unparam
          - gocritic
          - errcheck
          - bodyclose
      # gopdf drawing calls conventionally ignore errors.
      - path: pkg/pdf/
        linters:
          - gocritic
          - revive
          - unparam
          - errcheck
      # Experiments: gopdf drawing calls conventionally ignore errors.
      - path: exp/
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/shurco/gosign
  exclusions:
    paths:
      - web/
